<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кузница — сводка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
 --bg:var(--tg-theme-bg-color,#f6f5f1);
 --card:var(--tg-theme-secondary-bg-color,#fff);
 --tx:var(--tg-theme-text-color,#1d1d1b);
 --mut:var(--tg-theme-hint-color,#7a786f);
 --bd:rgba(125,125,120,.25);
 --green:#0f6e56;--greenb:#e1f5ee;--amber:#854f0b;--amberb:#faeeda;--red:#a32d2d;--redb:#fcebeb;}
@media(prefers-color-scheme:dark){:root{
 --greenb:#103b30;--amberb:#3a2c10;--redb:#3a1717;--green:#5dcaa5;--amber:#ef9f27;--red:#f09595;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 72px}
.loading{color:var(--mut);font-size:14px;padding:40px 0;text-align:center}
h1{font-size:21px;font-weight:600;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.hero{border-radius:16px;padding:18px 20px;margin-bottom:20px}
.hero .t{font-size:13px;opacity:.85;margin-bottom:3px}
.hero .h{font-size:22px;font-weight:600;margin-bottom:6px}
.hero .r{font-size:15px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:24px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px}
.mc .l{font-size:12px;color:var(--mut)}
.mc .v{font-size:24px;font-weight:600;margin:2px 0}
.mc .d{font-size:13px;font-weight:500}
.mc .n{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.4}
h2{font-size:16px;font-weight:600;margin:26px 0 11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:11px;color:var(--mut);text-align:center}
.cell{border-radius:9px;min-height:44px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between}
.cell .dd{font-size:11px;opacity:.85}
.cell .bb{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.65;align-self:flex-end}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:10px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px}
.sp{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:13px;margin:0 6px 6px 0}
.foot{color:var(--mut);font-size:12px;margin-top:26px;border-top:1px solid var(--bd);padding-top:13px}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
 border-top:1px solid var(--bd);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:8px 0 6px;font-size:10px;color:var(--mut);cursor:pointer;text-decoration:none;gap:2px}
.tabbar a .ti{font-size:20px;line-height:1}
.tabbar a.on{color:var(--tg-theme-button-color,#1D9E75)}
.wrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--bd);
 border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.wdot{width:9px;height:9px;border-radius:50%;flex:none}
.wmain{flex:1;min-width:0}
.wt{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsub{font-size:12.5px;color:var(--mut);margin-top:2px}
.wchev{color:var(--mut);font-size:20px;flex:none}
.back{color:var(--mut);font-size:14px;cursor:pointer;margin-bottom:10px;display:inline-block}
.reschip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:8px;
 padding:6px 11px;font-size:14px;font-weight:500;margin-bottom:8px}
.hist{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5}
.lens-hd{display:flex;align-items:center;gap:8px;margin:20px 0 12px}
.lens-hd span{font-size:11px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.lens-line{flex:1;height:1px}
.rdy-items{display:flex;flex-direction:column;gap:5px;margin-top:9px;font-size:12.5px}
.rdy-row{display:flex;align-items:center;gap:8px}
.rdy-name{width:108px;flex:none}
.rdy-bar{flex:1;height:8px;background:rgba(0,0,0,.18);border-radius:4px;position:relative}
.rdy-fill{position:absolute;top:0;height:100%;border-radius:4px}
.rdy-w{width:30px;text-align:right;flex:none;font-weight:600}
.sig-bar{position:relative;height:7px;background:var(--bd);border-radius:4px;margin-top:3px}
.sig-fill{position:absolute;left:30%;width:35%;height:100%;border-radius:4px}
.sig-cur{position:absolute;top:-2px;left:50%;width:3px;height:11px;border-radius:2px}
.wstats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:10px}
.wstats span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
.wfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wchip{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer}
.wchip-on{background:var(--greenb);border-color:var(--green);color:var(--green);font-weight:600}
.det-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.det-hd{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.55;margin-bottom:7px}
.det-te{background:var(--bg);border-radius:10px;padding:11px}
.te-title{font-size:15px;font-weight:700;color:var(--amber)}
.det-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.det-tile{background:var(--bg);border-radius:10px;padding:9px;text-align:center}
.det-tile-hi{background:var(--amberb);border:1px solid var(--amber)}
.det-tile-v{font-size:15px;font-weight:700}
.det-tile-l{font-size:10px;opacity:.55;margin-top:2px}
.narr-card{background:var(--card);border-left:3px solid var(--mut);border-radius:9px;padding:11px 13px}
.narr-title{font-weight:700;margin-bottom:4px;font-size:14px}
.narr-body{font-size:13px;line-height:1.5}
.bar{background:var(--bd);border-radius:4px;height:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:#1D9E75;border-radius:4px;min-width:0}
.ovr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.ring{width:60px;height:60px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(#1D9E75 calc(var(--p,0)*1%),var(--bd) 0)}
.ring>div{width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center}
.sec{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.goal{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.goal .gtop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}
.add{text-align:center;border:1px dashed var(--bd);border-radius:12px;padding:9px;color:var(--mut);font-size:12px;margin:2px 0 4px;cursor:pointer}
.disc{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--bd)}
.disc .nm{flex:1}.disc .nm b{font-size:13px}
.tierbar{display:flex;gap:2px;margin-top:4px;max-width:120px}
.tierbar .seg{flex:1;height:5px;border-radius:2px;background:var(--bd)}
.tierbar .seg.on{background:#1D9E75}
.pill{font-size:10px;padding:2px 8px;border-radius:10px;background:#2a2030;color:#ffb24c;border:1px solid #4a3a2a;white-space:nowrap}
.pill.none{background:var(--bd);color:var(--mut);border-color:var(--bd)}
.llmwrap{margin:16px 0 0;padding-top:15px;border-top:1px solid var(--bd)}
.llmhead{font-size:13px;font-weight:600;margin:0 2px 8px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.llmbtn{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font-size:13px;cursor:pointer}
.llmtext{font-size:13px;line-height:1.5;margin-bottom:8px}
.clwrap{margin:10px 0}
.clhead{font-size:13px;font-weight:600;margin:0 2px 8px;display:flex;align-items:center;gap:6px}
.cltext{font-size:13px;line-height:1.5}
.astro{margin-top:12px;padding:11px 13px;border:1px solid rgba(139,92,246,.45);border-radius:12px;background:rgba(139,92,246,.12)}
.astrohd{font-weight:600;font-size:13px;margin-bottom:5px;color:#b794f6}
.astrobody{font-size:13px;line-height:1.5}
.astrobody .mdsec{background:transparent;border:0;padding:0;margin:0}
.advice{border-radius:14px;padding:14px 16px;margin-bottom:14px}
.advice-hd{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.75;margin-bottom:7px}
.advice-src{opacity:.85;white-space:nowrap}
.advice-ttl{font-size:18px;font-weight:700;margin-bottom:3px}
.advice-txt{font-size:13.5px;line-height:1.45}
.advice-stale{margin-top:9px;font-size:11.5px;font-weight:600;color:var(--amber);opacity:.95}
.review-stale{font-size:11px;color:var(--mut);margin-left:6px}
.mdetail{background:rgba(128,128,128,.14);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;margin-bottom:12px}
.mdetail-hd{font-weight:600;font-size:14px;margin-bottom:5px}
.mdetail-desc{font-size:13px;line-height:1.45;margin-bottom:8px}
.mdetail-hint{font-size:11px;color:var(--mut);margin-top:5px}
.methelp{margin:14px 0 8px;font-size:13px}
.methelp summary{cursor:pointer;color:var(--mut);font-weight:600;padding:6px 0;list-style:none}
.methelp-it{font-size:12.5px;line-height:1.45;margin:8px 0}
.mc{cursor:default}
.mdsec{background:rgba(128,128,128,.14);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.mdsec:last-child{margin-bottom:0}
.mdsec .mdh{font-weight:600;font-size:14px;margin:0 0 6px}
.mdsec p{margin:0 0 7px}
.mdsec p:last-child{margin-bottom:0}
.mdsec ul{margin:5px 0 0;padding-left:18px}
.mdsec li{margin:2px 0}
.switcher{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--mut)}
.switcher select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.lbsel{margin:8px 0 14px}.lbsel select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--bd)}
.lbrow.me{background:var(--greenb);border-radius:8px}
.lbrow .pl{width:24px;color:var(--mut);font-weight:600}.lbrow .nk{flex:1}.lbrow .vl{color:var(--mut);font-size:13px}
.langsw{display:flex;gap:0;font-size:11px}
.langsw a{padding:3px 9px;border:1px solid var(--bd);color:var(--mut);cursor:pointer;text-decoration:none}
.langsw a:first-child{border-radius:8px 0 0 8px}
.langsw a:last-child{border-radius:0 8px 8px 0;border-left:none}
.langsw a.on{background:var(--tg-theme-button-color,#1D9E75);color:#fff;border-color:var(--tg-theme-button-color,#1D9E75)}
.topbar{display:flex;justify-content:flex-end;padding:2px 0 4px}
</style></head>
<body><div class="wrap">
<div class="topbar"><div class="langsw"><a data-lang="ru" onclick="setLang('ru')">RU</a><a data-lang="en" onclick="setLang('en')">EN</a></div></div>
<div id="app"><div class="loading">Кузница v2 · гружу…</div></div>
</div>
<script src="/static/strings.js?v=20260720"></script>
<script src="/static/body.js?v=20260719"></script>
<script src="/static/app.js?v=20260720"></script>
</body></html>
